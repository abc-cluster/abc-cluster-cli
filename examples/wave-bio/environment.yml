name: wave-bio
channels:
  - conda-forge
  - bioconda
  - defaults
dependencies:
  # sequence QC + trimming
  - fastqc>=0.12
  - fastp>=0.23
  - multiqc>=1.21

  # alignment
  - bwa-mem2>=2.2
  - minimap2>=2.28
  - samtools>=1.20

  # variant calling + manipulation
  - bcftools>=1.20
  - htslib>=1.20

  # R + bioinformatics packages (Wave builds these into the container;
  # no runtime conda install needed — image is reused on subsequent jobs)
  - r-base>=4.3
  - bioconductor-deseq2>=1.42
  - bioconductor-edger>=4.0
  - r-ggplot2>=3.5
  - r-dplyr>=1.1
  - r-readr>=2.1

  # utilities
  - pigz>=2.8
  - seqkit>=2.8
